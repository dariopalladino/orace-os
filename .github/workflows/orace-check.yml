name: ORACE change check

on:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Routing and architecture impact
        run: python3 scripts/orace.py check --diff "origin/${{ github.base_ref }}...HEAD" --github
