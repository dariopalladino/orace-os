name: validate

on:
  push:
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registry, coverage, and routing cases
        run: python3 scripts/spec.py validate
      - name: Skill adapters in sync
        run: python3 scripts/sync_skills.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Pull request architecture summary
        if: github.event_name == 'pull_request'
        run: python3 scripts/orace.py check --diff "origin/${{ github.base_ref }}...HEAD" --github
